services:
  postgres:
    image: postgres:17
    container_name: razorgrowth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: razorgrowth
      POSTGRES_USER: razorgrowth
      POSTGRES_PASSWORD: razorgrowth_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U razorgrowth -d razorgrowth"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: razorgrowth-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data: