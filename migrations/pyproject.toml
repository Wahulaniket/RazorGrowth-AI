[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "razorgrowth-api"
version = "0.1.0"
description = "RazorGrowth AI API"
requires-python = ">=3.11,<3.14"

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "asyncpg>=0.30,<1.0",
    "alembic>=1.15,<2.0",
    "pydantic-settings>=2.7,<3.0",
    "redis>=5.2,<6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]